<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>用户满意度调查</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#f7f8fa;color:#1f2329;font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;font-size:16px;line-height:1.8;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body.night{background:#000;color:#d8d8d8}
  body.night #card{background:#000;border-color:#1a1a1a;box-shadow:none}
  body.night .qtext{color:#e8e8e8}
  body.night .qnum{color:#555}
  body.night .sysline{color:#777}
  body.night .sysline.red{color:#ff2b2b}
  body.night .opt{background:#000;color:#d8d8d8;border-color:#2a2a2a}
  body.night .opt:hover{background:#111;border-color:#444}
  body.night #header{background:#000;border-color:#1a1a1a;color:#666}
  body.night #header .brand{color:#aaa}
  body.night #mutebtn{color:#888;border-color:#2a2a2a;background:#000}
  #header{position:fixed;top:0;left:0;right:0;height:46px;background:#fff;border-bottom:1px solid #e6e8eb;display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:20;font-size:13px;color:#6b7280}
  #header .brand{font-weight:600;color:#1f2329;letter-spacing:.02em}
  #header .side{display:flex;align-items:center;gap:14px}
  #mutebtn{background:none;border:1px solid #d9dce1;border-radius:6px;color:#6b7280;font:inherit;font-size:12px;padding:4px 10px;cursor:pointer;touch-action:manipulation}
  #mutebtn:hover{background:#f3f4f6}
  #stage{position:fixed;top:46px;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;padding:28px 16px 14px;overflow-y:auto}
  #card{background:#fff;border:1px solid #e6e8eb;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);max-width:580px;width:100%;padding:30px 32px 24px}
  .qnum{font-size:12px;letter-spacing:.12em;color:#9aa1ab;margin-bottom:14px}
  .qtext{font-size:17px;color:#1f2329;margin-bottom:22px;white-space:pre-wrap;word-break:break-word}
  .sysline{font-size:13px;color:#8b939c;margin-bottom:14px;white-space:pre-wrap}
  .sysline.red{color:#dc2626}
  .opt{display:block;width:100%;text-align:left;background:#fff;color:#1f2329;border:1px solid #d9dce1;border-radius:8px;padding:12px 16px;margin-bottom:10px;font:inherit;cursor:pointer;transition:background .12s,border-color .12s;touch-action:manipulation}
  .opt:hover{background:#f3f4f6;border-color:#b9c0c9}
  .opt:active{background:#e9ebee}
  #footer{margin-top:auto;padding-top:18px;text-align:center;font-size:12px;color:#9aa1ab;letter-spacing:.06em;max-width:580px;width:100%}
  #footer .red{color:#dc2626}
  body.night #footer{color:#555}
  body.night #footer .red{color:#ff2b2b}
  .later{font-size:15px;color:#dc2626;margin-top:18px;white-space:pre-wrap}
  /* ===== 惊吓效果 ===== */
  #flash{position:fixed;inset:0;background:#fff;z-index:90;opacity:0;pointer-events:none}
  #flash.on{animation:flashAnim .18s steps(2) forwards}
  @keyframes flashAnim{0%{opacity:1}70%{opacity:.9}100%{opacity:0}}
  #blackout{position:fixed;inset:0;background:#000;z-index:80;opacity:0;pointer-events:none;transition:opacity .08s}
  #blackout.on{opacity:1}
  #stage.shake{animation:shakeAnim .5s linear}
  body.shake,#type.shake{animation:shakeAnim .65s linear}
  body.shakeS,#type.shakeS{animation:shakeSAnim .4s linear}
  #type.pop .tl{animation:popIn .16s ease-out}
  @keyframes shakeSAnim{10%{transform:translate(-4px,2px)}25%{transform:translate(4px,-2px)}40%{transform:translate(-3px,1px)}55%{transform:translate(3px,-1px)}70%{transform:translate(-2px,1px)}85%{transform:translate(2px,0)}100%{transform:translate(0,0)}}
  @keyframes popIn{0%{transform:scale(1.7);opacity:.1}100%{transform:scale(1);opacity:1}}
  @keyframes shakeAnim{10%{transform:translate(-12px,6px) rotate(-.4deg)}20%{transform:translate(14px,-8px) rotate(.5deg)}30%{transform:translate(-10px,-6px)}40%{transform:translate(12px,8px)}50%{transform:translate(-8px,4px)}60%{transform:translate(8px,-4px)}70%{transform:translate(-4px,2px)}80%{transform:translate(4px,-2px)}90%{transform:translate(-2px,0)}100%{transform:translate(0,0)}}
  #type{position:fixed;inset:0;background:#000;z-index:100;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer}
  #type.on{display:flex}
  #type .tl{font-size:40px;font-weight:700;letter-spacing:.06em;line-height:1.5;color:#ff0000}
  @media (max-width:600px){
    #type .tl{font-size:26px}
    #card{padding:22px 20px 18px}
    #stage{padding:18px 12px 10px}
    #header{padding:0 12px}
  }
</style>
</head>

  buf: {},
  loaded: false,
  load: function () {
    if (this.loaded) return;
    var self = this;
    var keys = Object.keys(this.urls);
    var n = keys.length;
    function done() { if (--n === 0) self.loaded = true; }
    function decodeOne(k, b64, attempt) {
      attempt = attempt || 0;
      try {
        var bin = atob(b64);
        var len = bin.length;
        var bytes = new Uint8Array(len);
        for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
        Audio.ctx.decodeAudioData(bytes.buffer, function (buf) {
          self.buf[k] = buf;
          done();
        }, function () { if (attempt < 1) decodeOne(k, b64, attempt + 1); else done(); });
      } catch (e) { done(); }
    }
    keys.forEach(function (k) {
      var s = self.urls[k];
      var comma = s.indexOf(",");
      decodeOne(k, comma >= 0 ? s.slice(comma + 1) : s, 0);
    });
  },
  play: function (name, at, vol) {
    if (!Audio.on || Audio.muted || !this.buf[name]) return;
    try {
      var src = Audio.ctx.createBufferSource();
      src.buffer = this.buf[name];
      var g = Audio.ctx.createGain();
      g.gain.value = vol || 1;
      src.connect(g);
      g.connect(Audio.master);
      src.start(at || Audio.ctx.currentTime);
    } catch (e) {}
  }
};

/* ============================== DOM 助手 ============================== */
var card = document.getElementById("card");
var footer = document.getElementById("footer");
var stageEl = document.getElementById("stage");

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderCard() {
  card.innerHTML = "";
  footer.innerHTML = "";
}

function qnum(n) { card.appendChild(el("div", "qnum", n)); }

function qtext(str) { card.appendChild(el("div", "qtext", str)); }

function sysline(str, red) { card.appendChild(el("div", "sysline" + (red ? " red" : ""), str)); }

function opts(list) {
  list.forEach(function (b) {
    var btn = el("button", "opt", b.label);
    btn.addEventListener("click", function () {
      Audio.beep();
      state.answers[state.scene] = b.label;
      b.action();
    });
    card.appendChild(btn);
  });
}

function setFoot(text, red) {
  footer.innerHTML = "";
  footer.appendChild(el("div", red ? "red" : "", text));
}

function setNight(on) {
  document.body.classList.toggle("night", !!on);
}

/* ============================== 惊吓特效 ============================== */
var flashEl = document.getElementById("flash");
var blackoutEl = document.getElementById("blackout");
var typeEl = document.getElementById("type");

function whiteFlash(dur) {
  flashEl.classList.remove("on");
  void flashEl.offsetWidth;
  flashEl.classList.add("on");
  setTimeout(function () { flashEl.classList.remove("on"); }, dur || 200);
}

function setBlackout(on) {
  blackoutEl.classList.toggle("on", !!on);
}

function typeFlash(lines, done, hard) {
  typeEl.classList.add("on");
  if (hard) { typeEl.classList.add("shake"); shakeBody(false); }
  else { typeEl.classList.add("shakeS"); shakeBody(true); }
  typeEl.innerHTML = "";
  var div = document.createElement("div");
  div.className = "tl";
  typeEl.appendChild(div);
  var li = 0;
  function nextLine() {
    if (li >= lines.length) {
      setTimeout(function () { typeEl.classList.remove("on"); typeEl.classList.remove("shake"); typeEl.classList.remove("shakeS"); if (done) done(); }, 1000);
      return;
    }
    div.textContent = "";
    var line = lines[li];
    var ci = 0;
    var iv = setInterval(function () {
      ci++;
      div.textContent = line.slice(0, ci);
      if (ci >= line.length) {
        clearInterval(iv);
        li++;
        setTimeout(nextLine, 420);
      }
    }, 30);
  }
  nextLine();
}

function shakeOnce() {
  shakeBody(true);
}

function shakeBody(soft) {
  var cls = soft ? "shakeS" : "shake";
  document.body.classList.remove("shake");
  document.body.classList.remove("shakeS");
  void document.body.offsetWidth;
  document.body.classList.add(cls);
  setTimeout(function () { document.body.classList.remove(cls); }, soft ? 520 : 750);
}

/* 瞬时红字弹出:不做逐字,直接砸出,配合爆音与抖动 */
function redPop(line, hard, done) {
  Audio.burst();
  Audio.halt();
  typeEl.classList.add("on");
  typeEl.innerHTML = "";
  var div = document.createElement("div");
  div.className = "tl pop";
  div.textContent = line;
  typeEl.appendChild(div);
  if (hard) { typeEl.classList.add("shake"); shakeBody(false); }
  else { typeEl.classList.add("shakeS"); shakeBody(true); }
  setTimeout(function () {
    typeEl.classList.remove("on");
    typeEl.classList.remove("shake");
    typeEl.classList.remove("shakeS");
    if (done) done();
  }, 2300);
}

function nowTime() {
  var d = new Date();
  var p = function (n) { return String(n).padStart(2, "0"); };
  return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

/* ============================== 音频引擎 ============================== */
var Audio = {
  ctx: null, master: null, on: false, muted: false, pulseTimer: null,
  init: function () {
    if (this.ctx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.on = false; return; }
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.6;
      this.master.connect(this.ctx.destination);
      var g1 = this.ctx.createGain(); g1.gain.value = 0.02;
      var o1 = this.ctx.createOscillator(); o1.type = "sine"; o1.frequency.value = 60;
      var o2 = this.ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = 60.8;
      o1.connect(g1); o2.connect(g1); g1.connect(this.master);
      o1.start(); o2.start();
      var len = this.ctx.sampleRate * 2;
      var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      var src = this.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      var lp = this.ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 220;
      var ng = this.ctx.createGain(); ng.gain.value = 0.006;
      src.connect(lp); lp.connect(ng); ng.connect(this.master);
      src.start();
      this.on = true;
      SFX.load();
    } catch (e) { this.on = false; }
  },
  beep: function () {
    if (!this.on || this.muted) return;
    try {
      var t = this.ctx.currentTime;
      var o = this.ctx.createOscillator(); o.type = "sine"; o.frequency.value = 660;
      var g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + 0.2);
    } catch (e) {}
  },
  burst: function () {
    if (!this.on || this.muted) return;
    try {
      var t = this.ctx.currentTime;
      var o1 = this.ctx.createOscillator(); o1.type = "square"; o1.frequency.value = 880;
      var o2 = this.ctx.createOscillator(); o2.type = "square"; o2.frequency.value = 894;
      var g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o1.connect(g); o2.connect(g); g.connect(this.master);
      o1.start(t); o2.start(t); o1.stop(t + 0.2); o2.stop(t + 0.2);
    } catch (e) {}
  },
  halt: function () {
    if (!this.on || this.muted || !this.ctx) return;
    try {
      this.master.gain.cancelScheduledValues(this.ctx.currentTime);
      this.master.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.015);
      var self = this;
      setTimeout(function () {
        try { self.master.gain.setTargetAtTime(0.6, self.ctx.currentTime, 0.8); } catch (e2) {}
      }, 2200);
    } catch (e) {}
  },
  silence: function () {
    if (!this.on || !this.ctx) return;
    try { this.master.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.2); } catch (e) {}
  },
  fadeTo: function (v) {
    if (!this.on || !this.ctx) return;
    try {
      this.master.gain.cancelScheduledValues(this.ctx.currentTime);
      this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.05);
    } catch (e) {}
  },
  heartbeat: function (on) {
    if (this.pulseTimer) { clearInterval(this.pulseTimer); this.pulseTimer = null; }
    if (!on || !this.on || !this.ctx) return;
    var self = this;
    this.pulseTimer = setInterval(function () {
      if (!self.on || self.muted) return;
      try {
        var t = self.ctx.currentTime;
        var o = self.ctx.createOscillator(); o.type = "sine"; o.frequency.value = 52;
        var g = self.ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.13, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        o.connect(g); g.connect(self.master);
        o.start(t); o.stop(t + 0.26);
      } catch (e) {}
    }, 1100);
  },
  toggleMute: function () {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.6;
    return this.muted;
  }
};

document.getElementById("mutebtn").addEventListener("click", function () {
  Audio.init();
  var m = Audio.toggleMute();
  this.textContent = m ? "已静音" : "静音";
});
document.addEventListener("keydown", function (e) {
  if (e.key === "m" || e.key === "M") {
    Audio.init();
    var m = Audio.toggleMute();
    document.getElementById("mutebtn").textContent = m ? "已静音" : "静音";
  }
});

/* ============================== 报复跳杀(差评触发) ============================== */
/* 抵触值越高、进度越靠后,报复越重 */
function retaliate(done) {
  if (state.bad <= 0) { if (done) done(); return; }
  var tier;
  if (state.bad >= 8) tier = 3;
  else if (state.bad >= 4) tier = 2;
  else tier = 1;
  if (tier === 1) {
    Audio.burst();
    whiteFlash(160);
    typeFlash(["回答已同步。"], function () { if (done) done(); });
  } else if (tier === 2) {
    Audio.burst();
    Audio.halt();
    shakeOnce();
    typeFlash(["本问卷承诺不记录您的身份。", "承诺已更新。"], function () { if (done) done(); });
  } else {
    Audio.burst();
    Audio.halt();
    SFX.play("slam");
    shakeBody(false);
    setNight(true);

/* 差评选项动作:记录抵触 → 报复 → 进入下一题 */
function badChoice(n, nextScene, force) {
  state.bad += n;
  var p = Math.min(0.85, 0.35 + state.bad * 0.05);
  var trigger = force || Math.random() < p;
  if (trigger) retaliate(function () { go(nextScene); });
  else go(nextScene);
}

function goodChoice(nextScene) {
  go(nextScene);
}

/* 敲门结局:差评越多,门敲得越重。提交后直接黑屏,静默一拍,再敲门。 */
S.end_knock = {
  render: function () {
    document.title = "调查已完成";
    setNight(true);
    setBlackout(true);
    Audio.fadeTo(0.02);
    var bad = state.bad;
    var t0 = Audio.ctx ? Audio.ctx.currentTime : 0;
    if (bad <= 3) this.tier1(t0);
    else if (bad <= 7) this.tier2(t0);
    else this.tier3(t0);
  },
  tier1: function (t0) {
    var self = this;
    setTimeout(function () { Audio.fadeTo(0.9); }, 1200);
    setTimeout(function () { SFX.play("knock", t0 + 1.5, 1); }, 1500);
    setTimeout(function () { SFX.play("knock", t0 + 2.6, 1); }, 2600);
    setTimeout(function () { SFX.play("knock", t0 + 3.7, 1); }, 3700);
    setTimeout(function () {
      redPop("门外没有人。", false, function () { self.finish("门外没有人。", "调查已完成。"); });
    }, 4500);
  },
  tier2: function (t0) {
    var self = this;
    setTimeout(function () { Audio.fadeTo(0.9); }, 1200);
    setTimeout(function () { SFX.play("knockHeavy", t0 + 1.5, 1); }, 1500);
    setTimeout(function () { SFX.play("knockHeavy", t0 + 2.6, 1); }, 2600);
    setTimeout(function () { SFX.play("knockHeavy", t0 + 3.5, 1); }, 3500);
    setTimeout(function () { SFX.play("knockHeavy", t0 + 4.3, 1); }, 4300);
    setTimeout(function () {
      redPop("敲门声没有停。", false, function () { self.finish("敲门声没有停。", "门外的人没有离开。"); });
    }, 5100);
  },
  tier3: function (t0) {
    var self = this;
    setTimeout(function () { Audio.fadeTo(0.9); }, 1300);
    setTimeout(function () { SFX.play("slam", t0 + 1.7, 1); }, 1700);
    setTimeout(function () { SFX.play("slam", t0 + 3.2, 0.95); }, 3200);
    setTimeout(function () { Audio.heartbeat(true); }, 4200);
    setTimeout(function () { SFX.play("creak", t0 + 4.7, 1); }, 4700);
    setTimeout(function () { SFX.play("floor", t0 + 6.1, 0.95); }, 6100);
    setTimeout(function () { SFX.play("floor", t0 + 7.2, 0.95); }, 7200);
    setTimeout(function () {
      redPop("专员已到。", true, function () { self.finish("专员已到。", "SYSTEM TIME: " + nowTime() + " · 您填写问卷时的位置,已被更新。"); });
    }, 8300);
  },
  finish: function (line, sub) {
    Audio.heartbeat(false);
    setBlackout(false);
    renderCard();
    qnum("已完成");
    qtext(line);
    if (sub) sysline(sub, true);
    setFoot("");
    opts([{ label: "重新开始", action: function () { go("boot"); } }]);
  }
};
